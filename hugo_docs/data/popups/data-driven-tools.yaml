      <p>Configuration operates on the same list rather than on branches in the engine. <code>filterDisabledTools</code> drops anything named in <code>DISABLED_TOOLS</code> at build time, so a disabled tool's schema never reaches the LLM at all — the model cannot plan a call it was never shown. Other environment lists work the same way: <code>TIMEBOUND_TOOLS</code> and <code>USERBOUND_TOOLS</code> mark plans as non-cacheable, <code>STOCK_CODE_GENERATOR_TOOLS</code> declares which tools may legally occupy step 1 of a pipeline, and <code>EXCLUDE_TOOLS_FROM_CITATION</code> suppresses source references for private or synthesised output.</p>
      <p>One name in the plan grammar is deliberately <em>not</em> a registered tool: <code>compare_stocks</code>. The planner can emit it as a terminal step, and the pipeline routes it to the injected comparison synthesiser instead of looking it up in the registry.</p>
      <hr>
      <p><strong>Benefits:</strong></p>
      <ul>
          <li>Open for extension, closed for modification — adding the 31st tool is one struct, no engine change.</li>
          <li>A single source of truth for what the system can do, greppable in one file.</li>
          <li>Capability changes ship as configuration: disabling a tool is an environment variable, not a deploy of new logic.</li>
          <li>The cache, citation and planning rules all key off tool <em>names</em>, so they stay correct as the catalogue grows.</li>
      </ul>
