      <h2>Data-Driven Tool Registry</h2>
      <p>Tools are data, not code paths. All 30 are declared as <code>DynamicTool</code> values in one file, <code>tools/toolcore/definitions.go</code>, grouped into ten small builder functions (<code>buildSectorTools</code>, <code>buildFinancialDataTools</code>, <code>buildUserDataTools</code> and so on) that <code>BuildAllTools</code> concatenates. A repo-wide grep for <code>NameStr:</code> outside that file returns nothing: there is no second registry.</p>
      <p>The struct is four fields plus an optional fifth: a name, a description shown to the LLM, a JSON schema for the arguments, an <code>Executor</code> closure, and — for the one tool that supports it — a <code>StreamExecutor</code>. The engine only ever reads those fields. It has no knowledge of what any individual tool does.</p>
