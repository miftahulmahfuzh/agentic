label: "File Asset Integrity"
body: |2
      <h2>File Asset Integrity</h2>
      <p>Uploaded bytes are treated as hostile. Neither the client's declared <code>Content-Type</code> nor the filename extension is ever trusted or persisted: <code>SniffMIME</code> reads the leading bytes, probing for the ISO-BMFF <code>ftyp</code> box and its ten HEIF brands first — the standard library reports <code>application/octet-stream</code> for all of them, so iPhone uploads would otherwise be unclassifiable — then falling back to the stdlib sniffer. Other ISO-BMFF brands such as MP4 deliberately fall through, so a video cannot present itself as an image. The allow-list <strong>fails closed</strong>: an empty list rejects everything, because a misparsed <code>IMAGE_ALLOWED_MIME_TYPES</code> must not silently become "accept anything". A PNG-named file with an executable header is a clean 400.</p>
      <p>Ids are minted from <code>crypto/rand</code>: a kind prefix plus six random bytes as twelve lowercase hex characters, so <code>img_</code> ids are unguessable and ownership checking is not the only defence. A separate grammar check, not a prefix check, guards anything that touches a store, so a traversal-shaped id is rejected by construction rather than by a lookup happening to fail.</p>
      <div class="mermaid">
