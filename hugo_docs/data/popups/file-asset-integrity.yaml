      <p>Blobs live at <code>&lt;root&gt;/&lt;kind&gt;/&lt;yyyy&gt;/&lt;mm&gt;/&lt;dd&gt;/&lt;id&gt;.&lt;ext&gt;</code>, UTC date-sharded so no directory grows unmanageable and a future retention sweep is a directory operation. Directories are <code>0700</code>, files <code>0600</code>. Writes go to a temporary file in the destination directory and are renamed into place, with cleanup on every error path, so a crash mid-write cannot leave a truncated blob under an id that metadata already references. The extension comes from an explicit MIME table rather than the standard library's, whose ordering varies by platform and would make storage paths non-reproducible.</p>
      <p>Ordering is bytes first, metadata second. If the metadata write fails, <code>Persist</code> removes the blob it just wrote — a file with no document pointing at it is an uncollectable leak, so it is never allowed to exist. Persistence runs in <code>PersistAsync</code>, a detached goroutine that deliberately does not inherit the request context: the endpoint answers 202 immediately, which cancels that context, so the goroutine builds its own 30 second timeout instead. Failures are logged, not returned; a disk problem degrades to "the answer still streams, the image just is not downloadable later".</p>
      <hr>
      <p><strong>Benefits:</strong></p>
      <ul>
          <li>Format enforcement rests on actual bytes, so extension and header spoofing both fail.</li>
          <li>HEIC is accepted rather than rejected as octet-stream, which is what most phone uploads are.</li>
          <li>No half-written blobs and no orphaned blobs, under crash or under database failure.</li>
          <li>Storage never sits on the answer's critical path, and a wedged disk cannot leak goroutines.</li>
      </ul>
