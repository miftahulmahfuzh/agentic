      ID["NewFileID<br/>img_ plus 12 crypto-random hex"]
      ASYNC["PersistAsync<br/>detached goroutine, own 30s context"]
      TMP["CreateTemp in destination dir<br/>write, chmod 0600, close"]
      REN["Rename into place<br/>root/kind/yyyy/mm/dd/id.ext, dirs 0700"]
      META["SaveFileAsset<br/>insert, never upsert"]
      OK["Retrievable, owner-checked"]
