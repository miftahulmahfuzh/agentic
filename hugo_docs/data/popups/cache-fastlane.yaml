      </div>
      <p>A hit does not stream immediately. <code>waitForClientConnection</code> blocks on the request holder's <code>ClientConnected</code> channel first, because a cache hit can land before the browser has opened the SSE connection and streaming into a closed pipe would lose the answer. Once the client is attached the fast-lane emits three events: a time-to-first-token record tagged <code>cache_fastlane</code>, the whole answer as one token event, and a completion event with status <code>completed_from_cache</code>.</p>
      <p>Image-bearing turns are never cached, guarded independently at three layers: routing skips the fast-lane tier, the read path returns before any Redis call, and the preparer sets <code>ShouldCache = false</code> so nothing is ever written.</p>
      <hr>
      <p><strong>Benefits:</strong></p>
      <ul>
          <li>This is now the system's <strong>only</strong> duplicate-request collapsing mechanism. There is no separate deduplication layer above it.</li>
          <li>Cache workers are isolated from the normal worker pool, so cached answers stay fast while the pipeline is saturated.</li>
          <li>Excluding <code>conversation_id</code> means popular questions are answered once for the whole user base.</li>
          <li>The language and image suffixes keep semantically different turns from colliding on one entry.</li>
      </ul>
