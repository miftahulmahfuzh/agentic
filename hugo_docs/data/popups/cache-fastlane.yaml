label: "Cache Fast-Lane"
body: |2
      <h2>Cache Fast-Lane</h2>
      <p>Every text-only submit is offered to the cache fast-lane before it is allowed near the FIFO queue. <code>dispatchForProcessing</code> pushes the request onto <code>cacheRequestChan</code> with a 10 ms bound; if that channel is full the request falls through to the queue. Three dedicated goroutines (<code>TOTAL_CACHE_WORKERS</code>, default 3) drain the channel. They never acquire <code>processingSemaphore</code>, so a cache hit costs nothing from the normal worker budget.</p>
      <p>The key is built exactly once per submit, in <code>helpers.GenerateCacheKeyWithHistory</code> — the single place in the system where cache keys are generated. It concatenates the previous questions and the current question, normalises the result to lowercase letters and digits only (Unicode-aware, so Chinese survives), and prefixes it. A <code>:lang</code> suffix is appended when a language is set, and <code>:img_&lt;fp&gt;</code> when the turn carries image attachments, where the fingerprint is the first 16 hex characters of a SHA-256 over each blob, length-prefixed.</p>
      <p><strong><code>conversation_id</code> is deliberately excluded from the key.</strong> Two people asking the same question in two different conversations land on the same entry. That exclusion is the whole point: it is what turns a per-conversation cache into a cross-conversation, cross-user duplicate-work collapser.</p>
      <div class="mermaid">
  graph TD
      SUB["POST /chat/submit"]
      KEY["GenerateCacheKeyWithHistory<br/>normalised prev questions + question<br/>plus lang plus optional image fingerprint"]
      DISP["dispatchForProcessing"]
      CH["cacheRequestChan<br/>10 ms enqueue bound"]
      CW["3 cache workers<br/>TOTAL_CACHE_WORKERS<br/>no processingSemaphore"]
      GET["Redis lookup"]
      HIT["wait for client attach<br/>then emit 3 events"]
      MISS["routeToNormalProcessing<br/>takes processingSemaphore"]
      IMG["image turn<br/>fast-lane skipped"]
      QM["FIFO queue"]
      REDIS[("Redis<br/>ai_chatbot_conv entry<br/>TTL 24h")]

      SUB --> KEY --> DISP
      DISP -->|"text turn"| CH
      DISP -->|"has images"| IMG --> QM
      CH --> CW --> GET
      GET -->|"read"| REDIS
      GET -->|"hit"| HIT
      GET -->|"miss"| MISS

