label: "Parallel Map Execution"
body: |2
      <h2>Parallel Map Execution</h2>
      <p>A map step runs one tool once per item of an upstream array — typically the stock codes a generator step produced, capped at 30 by default. Run serially that is 30 sequential backend calls. <code>ExecuteToolsMap</code> instead fans out over a bounded worker pool: a buffered channel of size <code>ParallelLimit</code> acts as the semaphore, one goroutine per item takes a slot, and a <code>sync.WaitGroup</code> joins them. Each result carries its index and is written into a pre-sized slice, so the joined output stays ordered regardless of completion order, and a failed iteration becomes a failure marker rather than failing the whole step.</p>
      <p>The limit is per step. <code>ExecuteToolsMap</code> reads <code>step.ParallelLimit</code> and falls back to <code>config.AppSettings.DefaultParallelLimit</code> when the planner left it unset — <code>DEFAULT_PARALLEL_LIMIT</code>, default 5, raised to 20 in the development <code>.env</code>. Each individual tool call is retried through the shared retry helper at <code>DEFAULT_RETRY_LIMIT</code> (default 3) with exponential backoff from 1 s, capped at 30 s.</p>
