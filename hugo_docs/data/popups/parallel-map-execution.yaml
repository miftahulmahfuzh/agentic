      </div>
      <p>Two guards sit around the fan-out. <code>MAX_TOTAL_STOCKS_FOR_MAP_EXECUTION</code> (default 30) truncates the item list in all three source-resolution paths in <code>map_fallback.go</code> — the pre-extracted stock codes, the peek fallback, and the LLM extraction fallback — so a generator that returns 400 codes cannot turn one turn into 400 backend calls. And when the map source cannot be resolved at all, the step degrades gracefully instead of failing: <code>ErrMapSourceNotNeeded</code> tells the executor to fall back to plain parallel execution, which is correct whenever the tools already carry complete arguments.</p>
      <p>Anchors: <code>tools/toolcore/pipeline/execution/map.go:138-145</code> for the pool setup, <code>tools/toolcore/pipeline/execution/map_fallback.go</code> for source resolution and the cap.</p>
      <hr>
      <p><strong>Benefits:</strong></p>
      <ul>
          <li>Wall-clock time for a map step is roughly the slowest call, not the sum of all calls.</li>
          <li>Bounded rather than unbounded fan-out: backends are never hit by 30 simultaneous requests unless the limit says so.</li>
          <li>Per-step overrides let an expensive tool run narrower than the global default.</li>
          <li>The cap and the parallel fallback make a bad plan degrade in latency, not in correctness.</li>
      </ul>
