  <h2>Runtime Kill Switch</h2>
  <p>Two different mechanisms gate this tool and they are not interchangeable.</p>
  <p>The <code>ENABLE_STOCK_PICKER</code> family is <strong>boot-time</strong>. <code>ENABLE_STOCK_PICKER</code> is unusual among the project's flags in that it gates <em>registration</em> rather than callability — off, the tool is not in the registry and the planner never sees its schema. <code>DISABLED_TOOLS</code> remains an independent kill switch on top of it. <code>ENABLE_STOCK_PICKER_SIMILAR</code>, <code>ENABLE_STOCK_PICKER_RISK_FLAGS</code> and <code>ENABLE_STOCK_PICKER_AUDIT_JOB</code> gate the branches: with the similar branch off the turn tail is byte-identical to its shape before that branch existed, and with risk flags off the resolver is a no-op and the risk notes stay empty.</p>
  <p>The <strong>incident</strong> switch is something else entirely: a control-plane document in <code>ai_stock_picker_flags</code>, read by <code>observe</code> on <em>every</em> invocation and cached 30 seconds. Flipping it stops the tool within half a minute, with no redeploy and no restart. Collection bootstrap is deliberately <em>not</em> gated on <code>ENABLE_STOCK_PICKER</code>, so a flag flip on a deployment that has never run the tool still finds its collections.</p>
  <p>Around it, <code>observe</code> is the single event API for the feature: it writes the audit row, scores seven guardrails daily, and raises four realtime rate alerts to DingTalk. The deployment status today: <code>ENABLE_STOCK_PICKER=true</code> is pinned in both the production and staging compose files, and <code>stock_picker</code> has been live in production since 2026-09-23.</p>
  <hr>
  <p><strong>Benefits:</strong></p>
  <ul>
      <li>An incident is a flag flip measured in seconds, not a deploy measured in minutes.</li>
      <li>Boot flags keep a dark path genuinely dark — no schema, no tool, no surface.</li>
      <li>Bootstrapping outside the flag means enabling never meets a missing collection.</li>
      <li>Guardrail scoring and alerting live with the event API that already sees every turn.</li>
  </ul>
